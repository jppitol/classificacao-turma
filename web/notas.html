<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas notas · Turma XXX</title>
  <script src="tema.js"></script>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-180.png">
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="notas.js"></script>
</head>
<body>
  <p class="carregando" id="carregando">Carregando...</p>
  <main class="pagina" id="conteudo" hidden>
    <h1>Minhas notas</h1>
    <p class="dica" style="margin:0 0 1rem">A nota é salva quando você sai do campo. Para deixar uma avaliação em branco, toque no × ao lado da nota.</p>
    <form class="cartao lancamento" id="lancamento" autocomplete="off">
      <h2 class="cartao-titulo">Lançamento rápido</h2>
      <div class="lancamento-linha">
        <label>Semestre <select name="semestre"></select></label>
        <label>Disciplina <select name="disciplina"></select></label>
      </div>
      <div class="lancamento-linha">
        <label>Avaliação <select name="avaliacao"></select></label>
        <label>Nota <input name="nota" type="text" inputmode="decimal" placeholder="-"></label>
      </div>
      <button class="botao" type="submit">Salvar</button>
      <p class="status lancamento-status" id="lancamento-status" aria-live="polite"></p>
    </form>

    <div class="abas" id="abas-semestre" role="tablist"></div>
    <div id="semestres"></div>
  </main>
</body>
</html>
