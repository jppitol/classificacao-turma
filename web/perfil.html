<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil · Turma XXX</title>
  <script src="tema.js"></script>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-180.png">
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="perfil.js"></script>
</head>
<body>
  <p class="carregando" id="carregando">Carregando...</p>
  <main class="pagina pagina-estreita" id="conteudo" hidden>
    <h1>Perfil</h1>

    <div class="cartao">
      <dl class="dados">
        <dt>Nome de guerra</dt><dd id="nome-guerra"></dd>
        <dt>Segmento</dt><dd id="segmento"></dd>
        <dt>Email</dt><dd id="email"></dd>
      </dl>
    </div>

    <div class="cartao">
      <h2 class="cartao-titulo">Aparência</h2>
      <div class="seletor-tema" role="radiogroup" aria-label="Tema">
        <label><input type="radio" name="tema" value="claro"><span>Claro</span></label>
        <label><input type="radio" name="tema" value="escuro"><span>Escuro</span></label>
        <label><input type="radio" name="tema" value="auto"><span>Automático</span></label>
      </div>
      <p class="dica" style="margin:0.5rem 0 0">Automático segue o tema do celular ou do computador. Vale só neste aparelho.</p>
    </div>

    <div class="cartao">
      <h2 class="cartao-titulo">Trocar a senha</h2>
      <div id="mensagem" class="mensagem" role="status" hidden></div>
      <form id="form-senha">
        <label>Nova senha
          <input type="password" name="senha" autocomplete="new-password" minlength="6" required>
        </label>
        <label>Repita a nova senha
          <input type="password" name="confirmar" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="botao" type="submit">Salvar nova senha</button>
      </form>
    </div>

    <button type="button" class="botao-secundario botao-sair" id="sair">Sair</button>
  </main>
</body>
</html>
